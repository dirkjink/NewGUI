site_name: NewGUI
site_description: Plattformübergreifendes UI-Toolkit in C++23, nach dem Vorbild des Interface Kit von Haiku
site_url: https://dirkjink.github.io/NewGUI/
repo_url: https://github.com/dirkjink/NewGUI
repo_name: dirkjink/NewGUI
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dunkles Farbschema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Helles Farbschema
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

# The Doxygen pages of the API reference (main page, namespaces); Doxygen
# reads them, MkDocs must not copy them into the site.
exclude_docs: |
  api/

nav:
  - Start: index.md
  # The project documents live in the repository root (outside this
  # docs_dir). .github/scripts/generate-doc-pages.py copies them to
  # docs/project/ with rewritten links in the Docs workflow; not checked in -
  # run the script before building locally, or the --strict build fails
  # (which is the guard against a hand-maintained, drifting copy).
  - Projektdokumente:
      - Spezifikation der Canvas-Schicht: project/canvas-core-profil-spezifikation.md
      - Abschätzung des Gesamtumfangs: project/toolkit-gesamtumfang.md
      - Konventionen: project/CONVENTIONS.md
      - Sicherheitsrichtlinie: project/SECURITY.md
  # Generated by .github/scripts/generate-test-catalog.py in the Docs
  # workflow (after the test run); not checked in, same guard as above.
  - Test-Nachweis: tests/test-evidence.md
  - Coverage-Bericht: https://dirkjink.github.io/NewGUI/coverage/
  - API-Referenz: https://dirkjink.github.io/NewGUI/api/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # Collapsible rationale blocks on the generated test-evidence page.
  - pymdownx.details
  - tables
