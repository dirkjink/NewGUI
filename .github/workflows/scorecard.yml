# OpenSSF Scorecard: an outside assessment of this repository's supply-chain
# posture (pinned dependencies, token permissions, branch protection,
# dangerous workflow patterns, SAST, ...). It complements the other security
# workflows: codeql.yml checks the code we write, this one checks how the
# project is set up and released.

name: Scorecard

on:
  push:
    branches: [main]
  # Weekly: the checks and their heuristics evolve, and several of them
  # observe repository settings that can change without a commit.
  schedule:
    - cron: "41 6 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload the SARIF results to the repository's Security tab.
      security-events: write
      # OIDC token, required by publish_results, which makes the public
      # badge and the api.scorecard.dev entry work.
      id-token: write
    steps:
      # persist-credentials: false is required by scorecard-action: it
      # analyses the checkout and must not find a credentialed remote.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Branch-Protection check reads the repository ruleset
      # "protect-main" (no deletion, no force push, required check "Build"),
      # which the default token can see. The equivalent classic branch
      # protection stays configured but is unreadable without an admin PAT
      # in repo_token. Required reviews are deliberately absent (single
      # maintainer), so the check scores partial by design: no secret to
      # provision and rotate.
      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
