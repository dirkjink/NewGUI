# Configure, build and test with warnings as errors (preset "ci") on all
# supported compilers and with Skia (preset "skia"), check that the build is
# reproducible and that the rationale blocks of the tests are well-formed.
# The job "Build" summarizes these jobs and is the required status check for
# "main". The dependency scan and Skia on Windows run alongside, outside
# the required check.
#
# All actions are pinned to commit SHAs, not mutable tags: a moved tag would
# otherwise run foreign code with this workflow's token. Dependabot keeps the
# pins current.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly published advisory surfaces even when nothing was
  # committed - a scan that only runs on changes cannot see the world
  # changing around unchanged code.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux (${{ matrix.compiler.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-13, cc: gcc-13, cxx: g++-13 }
          - { name: gcc-14, cc: gcc-14, cxx: g++-14 }
          - { name: clang-19, cc: clang-19, cxx: clang++-19 }
          - { name: clang-20, cc: clang-20, cxx: clang++-20 }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image ships Clang 16 to 18 only; 19 and 20 come from the
      # Ubuntu archive (CONVENTIONS.md, section 1: Clang 19 or newer).
      - name: Install the compiler
        run: command -v "$CXX" || .github/scripts/apt-install.sh "$CC"

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: ${{ matrix.compiler.name }}

      - name: Configure, build and test
        run: cmake --workflow --preset ci

      # vcpkg's new packages for later runs, also when the step failed
      - name: Keep the vcpkg packages
        if: always()
        uses: ./.github/actions/save-vcpkg

      # The HTML reports of failed snapshots (specification 20.5, 20.9).
      - name: Keep the snapshot report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-report-${{ matrix.compiler.name }}
          path: build/ci/snapshot-report
          if-no-files-found: ignore

  windows:
    name: Windows (msvc-2022)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: msvc-2022

      # The developer environment provides cl, CMake and Ninja. It may set
      # VCPKG_ROOT to the copy bundled with Visual Studio, so it is set
      # again afterwards.
      - name: Configure, build and test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg"
          cmake --workflow --preset ci

      # vcpkg's new packages for later runs, also when the step failed
      - name: Keep the vcpkg packages
        if: always()
        uses: ./.github/actions/save-vcpkg

      # The HTML reports of failed snapshots (specification 20.5, 20.9).
      - name: Keep the snapshot report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-report-msvc-2022
          path: build/ci/snapshot-report
          if-no-files-found: ignore

  # macOS on Apple Silicon with Xcode's Clang and libc++. Part of the
  # required check "Build".
  macos:
    name: macOS (apple-clang)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: apple-clang

      - name: Configure, build and test
        run: cmake --workflow --preset ci

      # vcpkg's new packages for later runs, also when the step failed
      - name: Keep the vcpkg packages
        if: always()
        uses: ./.github/actions/save-vcpkg

      # The HTML reports of failed snapshots (specification 20.5, 20.9).
      - name: Keep the snapshot report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-report-apple-clang
          path: build/ci/snapshot-report
          if-no-files-found: ignore

  # The library is built twice from copies of the source at different paths;
  # both builds must give the same bytes. This guards -ffile-prefix-map and
  # -Wdate-time (cmake/NguiCompilerOptions.cmake): a build that embeds its
  # path or time fails here.
  reproducible:
    name: Reproducible (${{ matrix.compiler.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-13, cc: gcc-13, cxx: g++-13 }
          - { name: clang-19, cc: clang-19, cxx: clang++-19 }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the compiler
        run: command -v "$CXX" || .github/scripts/apt-install.sh "$CC"

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: reproducible-${{ matrix.compiler.name }}

      - name: Build twice at different paths and compare
        run: |
          for dir in "$RUNNER_TEMP/a/NewGUI" "$RUNNER_TEMP/b/other/place/NewGUI"; do
            mkdir -p "$dir"
            git archive HEAD | tar -x -C "$dir"
            (cd "$dir" \
              && cmake --preset release -DNGUI_BUILD_TESTS=OFF -DVCPKG_MANIFEST_FEATURES="text;svg" \
              && cmake --build --preset release)
          done
          # The core library (with its embedded icons), the text library
          # (embedded fonts) and the icon renderer.
          for library in libngui.a libngui_text.a libngui_svg.a; do
            sha256sum "$RUNNER_TEMP"/a/NewGUI/build/release/src/$library \
              "$RUNNER_TEMP"/b/other/place/NewGUI/build/release/src/$library | tee hashes.txt
            test "$(cut -d' ' -f1 hashes.txt | sort -u | wc -l)" -eq 1
          done

      # vcpkg's new packages for later runs, also when the step failed
      - name: Keep the vcpkg packages
        if: always()
        uses: ./.github/actions/save-vcpkg

  # Skia from the vcpkg port (feature skia), built from source on the first
  # run (10 to 15 minutes) and then restored from the binary cache (about a
  # minute). Part of the required check "Build".
  skia:
    name: Linux (skia, gcc-13)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: skia-gcc-13

      # SDL3 builds its X11 and Wayland support against the system's
      # development headers (vcpkg port sdl3, features x11 and wayland);
      # Skia's OpenGL backend needs those of EGL, OpenGL and GLES. Mesa's
      # software renderer (llvmpipe) gives the GPU tests an OpenGL context
      # without a GPU (phase G); poppler's tools read the PDFs of the export
      # tests (19.4); Xvfb is the X server of the XDND tests (module P4), XTest
      # moves and presses their mouse; dbus gives the notification test its
      # session bus (module P5).
      - name: Install the window system headers
        run: .github/scripts/apt-install.sh libx11-dev libxext-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libgl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri poppler-utils xvfb xauth libxtst-dev dbus

      - name: Configure, build and test with Skia and SDL3
        run: cmake --workflow --preset skia

      # Drag & drop with other programs on X11 (module P4): the tests need an
      # X server, and the other tests run without one (SDL's offscreen
      # driver), so these run on their own under Xvfb.
      - name: Test drag & drop on X11
        run: xvfb-run -a build/skia/tests/ngui_sdl3_tests --gtest_filter='SdlX11*'

      # The desktop's notifications (module P5): the test is the notification
      # server on a session bus of its own, which the other tests do without.
      - name: Test notifications over D-Bus
        run: dbus-run-session -- env SDL_VIDEODRIVER=offscreen build/skia/tests/ngui_sdl3_tests --gtest_filter='DbusNotifications*'

      # vcpkg's new packages for later runs, also when the step failed
      - name: Keep the vcpkg packages
        if: always()
        uses: ./.github/actions/save-vcpkg

      # The HTML reports of failed snapshots (specification 20.5, 20.9).
      - name: Keep the snapshot report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-report-skia-gcc-13
          path: build/skia/snapshot-report
          if-no-files-found: ignore

  # Skia, SDL3 and AccessKit on macOS (Apple Silicon, Xcode's Clang); SDL3
  # runs on its offscreen driver as on Linux. poppler's tools read the PDFs
  # of the export tests (19.4); the Cocoa tests (NSAccessibility, menu
  # bar) use SDL's Cocoa driver. Part of the required check "Build".
  skia-macos:
    name: macOS (skia, apple-clang)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: skia-apple-clang

      - name: Install poppler
        run: brew install poppler

      # vcpkg builds the packages while configuring; they are kept right
      # then, also when the build or the tests fail afterwards.
      - name: Configure with Skia and SDL3
        run: cmake --preset skia

      - name: Keep the vcpkg packages
        if: always()
        uses: ./.github/actions/save-vcpkg

      - name: Build and test
        run: |
          cmake --build --preset skia
          ctest --preset skia

      # A crash leaves no trace in the test output on macOS: the failed
      # tests of the SDL platform again under lldb, for the backtraces.
      - name: Backtrace of failed SDL tests
        if: failure()
        working-directory: build/skia/tests
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          log=../Testing/Temporary/LastTestsFailed.log
          failed=$(grep -E "Sdl(Platform|Gpu)Test" "$log" | sed 's/^[0-9]*://' | paste -sd: -)
          if [ -n "$failed" ]; then
            lldb --batch -o run -k "thread backtrace all" -k quit \
              -- ./ngui_sdl3_tests --gtest_filter="$failed" || true
          fi

      # The HTML reports of failed snapshots (specification 20.5, 20.9).
      - name: Keep the snapshot report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-report-skia-apple-clang
          path: build/skia/snapshot-report
          if-no-files-found: ignore

  # Skia with MSVC (cl.exe, as the vcpkg port builds it on Windows). Outside
  # the required check until its build time and stability are known.
  skia-windows:
    name: Windows (skia, msvc-2022)
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: skia-msvc-2022

      # As in the job "windows": the developer environment, then VCPKG_ROOT
      # again.
      - name: Configure, build and test with Skia
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg"
          cmake --workflow --preset skia

      # vcpkg's new packages for later runs, also when the step failed
      - name: Keep the vcpkg packages
        if: always()
        uses: ./.github/actions/save-vcpkg

      # The HTML reports of failed snapshots (specification 20.5, 20.9).
      - name: Keep the snapshot report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-report-skia-msvc-2022
          path: build/skia/snapshot-report
          if-no-files-found: ignore

  # Published advisories in the dependencies that ship (CONVENTIONS.md 8.2).
  # Deliberately not part of the required check "Build": a newly published
  # advisory must be visible at once, but it must not block unrelated pull
  # requests. vcpkg installs the manifest without the "tests" feature, so
  # the SBOM holds exactly the shipped ports.
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Same compiler and cache as the job "skia", so that Skia is built once.
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: skia-gcc-13

      - name: Install the window system headers
        run: .github/scripts/apt-install.sh libx11-dev libxext-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libgl-dev libgles-dev

      # Everything that ships: the default dependencies, the text subsystem,
      # Skia and SDL3, without the test-only "tests" feature.
      - name: Install the shipped dependencies
        run: '"$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-feature=text --x-feature=svg --x-feature=skia --x-feature=sdl3 --x-feature=accessibility --x-install-root=build/sbom/vcpkg_installed'

      # vcpkg's new packages for later runs, also when the step failed
      - name: Keep the vcpkg packages
        if: always()
        uses: ./.github/actions/save-vcpkg

      - name: Generate the SPDX SBOM of the shipped dependencies
        run: python3 .github/scripts/vcpkg-sbom.py build/sbom/vcpkg_installed/x64-linux build/sbom/newgui.spdx.json

      # Fails the job when a dependency is affected by a known advisory.
      # Exceptions go into osv-scanner.toml with reason and expiry date, see
      # the script.
      - name: Scan the SBOM against the OSV database
        run: python3 .github/scripts/osv-scan.py build/sbom/newgui.spdx.json

      # Kept regardless of the scan result, so a red run leaves behind the
      # exact dependency set it judged.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: build/sbom/newgui.spdx.json
          if-no-files-found: error

  # The rationale blocks of the tests feed the test-evidence page of the docs
  # site (CONVENTIONS.md, section 8.3); a malformed one fails here, before it
  # can reach the page. Reads the sources only, no build needed.
  test-rationale:
    name: Test rationale
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the rationale blocks
        run: python3 .github/scripts/generate-test-catalog.py --check

  build:
    name: Build
    if: always()
    needs: [linux, windows, skia, macos, skia-macos, reproducible, test-rationale]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          SKIA: ${{ needs.skia.result }}
          MACOS: ${{ needs.macos.result }}
          SKIA_MACOS: ${{ needs.skia-macos.result }}
          REPRODUCIBLE: ${{ needs.reproducible.result }}
          RATIONALE: ${{ needs.test-rationale.result }}
        run: |
          echo "linux: $LINUX, windows: $WINDOWS, skia: $SKIA, macos: $MACOS, skia-macos: $SKIA_MACOS, reproducible: $REPRODUCIBLE, test rationale: $RATIONALE"
          test "$LINUX" = success && test "$WINDOWS" = success && test "$SKIA" = success \
            && test "$MACOS" = success && test "$SKIA_MACOS" = success \
            && test "$REPRODUCIBLE" = success && test "$RATIONALE" = success
