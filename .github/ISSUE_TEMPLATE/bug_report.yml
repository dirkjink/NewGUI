name: Fehlerbericht
description: Einen Fehler im Toolkit melden
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Was ist passiert?
      description: >
        Was hast du beobachtet, und was hättest du stattdessen erwartet?
        Screenshots, Layout-Snapshots oder Log-Ausgaben helfen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduktion
      description: Minimale Schritte oder ein kleines Beispielprogramm, wenn möglich.
      render: cpp
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: NewGUI-Version oder Commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Umgebung
      description: "Betriebssystem, Compiler mit Version, Backend (Skia, Blend2D, Dump), Look."
    validations:
      required: false
