# Saves vcpkg's binary cache if the job added packages to it, under the key
# setup-vcpkg chose for this run (see there). Use it right after the step
# that installs the packages (configuring), with `if: always()`, so that a
# failing build or test keeps them too.

name: Save vcpkg packages
description: The binary cache of vcpkg, if this job built packages

runs:
  using: composite
  steps:
    - name: Count vcpkg packages
      id: count
      shell: bash
      run: |
        count=$(find .vcpkg-cache -type f 2>/dev/null | wc -l | tr -d ' ')
        echo "packages restored: ${VCPKG_CACHE_FILES:-none}, now: $count"
        if [ -n "${VCPKG_CACHE_KEY:-}" ] && [ "$count" -gt "${VCPKG_CACHE_FILES:-0}" ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save vcpkg packages
      if: steps.count.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .vcpkg-cache
        key: ${{ env.VCPKG_CACHE_KEY }}
